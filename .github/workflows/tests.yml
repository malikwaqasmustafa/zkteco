name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Realistic PHP/Laravel compatibility matrix
        include:
          # Laravel 6.x - PHP 7.4 only
          - php: 7.4
            laravel: 6.*
            dependency-version: prefer-stable
          # Laravel 8.x - PHP 7.4, 8.0
          - php: 7.4
            laravel: 8.*
            dependency-version: prefer-stable
          - php: 8.0
            laravel: 8.*
            dependency-version: prefer-stable
          # Laravel 9.x - PHP 8.0, 8.1
          - php: 8.0
            laravel: 9.*
            dependency-version: prefer-stable
          - php: 8.1
            laravel: 9.*
            dependency-version: prefer-stable
          # Laravel 10.x - PHP 8.1, 8.2
          - php: 8.1
            laravel: 10.*
            dependency-version: prefer-stable
          - php: 8.2
            laravel: 10.*
            dependency-version: prefer-stable

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, sockets, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, pdo
        coverage: none

    - name: Install dependencies
      run: |
        composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
        composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

    - name: Execute tests (via PHPUnit)
      run: vendor/bin/phpunit 